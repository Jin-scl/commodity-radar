    value: 0.7
    unit: "°C"
    timestamp: "2026-05-26"
    source: "NOAA CPC (manual cache)"
    notes: "周度 Niño 3.4 海温异常"

  oni:
    value: 0.6
    unit: "°C"
    timestamp: "2026-05-15"
    notes: "Oceanic Niño Index 月度"

  oni_consecutive_months_above_0_5:
    value: 2
    unit: "months"
    notes: "连续超过 +0.5 的月数；>=3 视为确认厄尔尼诺"

  soi:
    value: -0.8
    unit: "index"
    timestamp: "2026-05-30"

  soi_consecutive_negative_weeks:
    value: 4
    unit: "weeks"

  enso_state:
    value: "El Niño Watch"
    notes: "可选: Neutral / El Niño Watch / El Niño / Strong El Niño / La Niña Watch / La Niña / Strong La Niña"

