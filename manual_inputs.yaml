# commodity_radar — 手动输入兜底数据
#
# 使用规则：
# 1) 任何 fetcher 抓取失败时，rules.py 会优先读取本文件对应字段
# 2) 你也可以把任何字段的 value 改为 null，让评分时显式忽略
# 3) 时间戳缺省时使用今日；建议手动填实际观测日期，便于历史比对
# 4) confidence 默认 "medium"（manual）；如果是非常确定可设 "high"
#
# 字段命名约定：
#   *_anomaly_pct        : 与"常年"比的百分比偏离（-30 = 低 30%）
#   *_consecutive_*_days : 连续天数（用于趋势规则）
#   *_change_*           : 同比/环比变化
#   _mt / _kt            : 百万吨 / 千吨
#   _pp                  : 百分点 (percentage points)
#
# 日期：所有 timestamp 字段建议 ISO 8601（YYYY-MM-DD）

snapshot_date: "2026-05-31"

